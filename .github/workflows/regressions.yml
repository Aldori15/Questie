name: Regression tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regressions:
    name: Lua and Python regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: addon
    env:
      PYTHONNOUSERSITE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      QUESTIE_TEST_LUA: lua5.2
      QUESTIE_TEST_LUAC: luac5.1
      QUESTIE_BRIDGE_SOURCE: ${{ github.workspace }}/source/modules/mod-questie-bridge
    steps:
      - name: Check out addon
        uses: actions/checkout@v7
        with:
          path: addon
          persist-credentials: false

      - name: Check out matching bridge contracts
        uses: actions/checkout@v7
        with:
          repository: Aldori15/mod-questie-bridge
          ref: main
          path: source/modules/mod-questie-bridge
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y lua5.1 lua5.2

      - name: Run regression checks
        run: python -B tools/run_regressions.py --ci
