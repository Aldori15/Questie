name: Regression tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regressions:
    name: Lua and Python regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: addon
    env:
      PYTHONNOUSERSITE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      QUESTIE_TEST_LUA: lua5.2
      QUESTIE_TEST_LUAC: luac5.1
      QUESTIE_BRIDGE_SOURCE: ${{ github.workspace }}/source/modules/mod-questie-bridge
    steps:
      - name: Check out addon
        uses: actions/checkout@v7
        with:
          path: addon
          persist-credentials: false

      - name: Check out matching bridge contracts
        uses: actions/checkout@v7
        with:
          repository: Aldori15/mod-questie-bridge
          # Bridge contract revision.
          ref: ad6ebd8fd70270992d0d843f0dc8c73ba924be30
          path: source/modules/mod-questie-bridge
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y lua5.1 lua5.2

      - name: Check addon Lua 5.1 syntax
        run: python -B tools/check_lua_syntax.py --luac luac5.1

      - name: Check Lua regression test syntax
        run: |
          for test in tools/tests/test_*.lua; do
            luac5.2 -p "$test"
          done

      - name: Run Lua 5.1-compatible regression suites
        run: |
          # Tests declare Lua 5.1 support in their first-line run instructions.
          for test in tools/tests/test_*.lua; do
            IFS= read -r header < "$test"
            if [[ "$header" == *"Lua 5.1"* ]]; then
              echo "Running $test (Lua 5.1)"
              lua5.1 "$test"
            fi
          done

      - name: Run Lua regression suites
        run: |
          for test in tools/tests/test_*.lua; do
            echo "Running $test"
            lua5.2 "$test"
          done

      - name: Run Python regression suites
        run: python -B -m unittest discover -s tools/tests -p 'test_*.py' -v
